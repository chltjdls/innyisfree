<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>캠핑 음식 뽑기 🎴</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap');

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #f5f0e8;
            --surface: #fff;
            --border: rgba(0,0,0,0.1);
            --text-primary: #1a1a1a;
            --text-secondary: #6b6b6b;
            --noodle-bg: #EEEDFE;
            --noodle-text: #3C3489;
            --noodle-border: #AFA9EC;
            --snack-bg: #FAEEDA;
            --snack-text: #633806;
            --snack-border: #EF9F27;
            --anju-bg: #FAECE7;
            --anju-text: #712B13;
            --anju-border: #F0997B;
            --dessert-bg: #FBEAF0;
            --dessert-text: #72243E;
            --dessert-border: #ED93B1;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem 3rem;
            color: var(--text-primary);
        }

        h1 {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
            letter-spacing: -0.02em;
        }

        .subtitle {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 2rem;
        }

        .btn-row {
            display: flex;
            gap: 10px;
            margin-bottom: 2rem;
        }

        button {
            cursor: pointer;
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 0.875rem;
            font-weight: 500;
            border-radius: 8px;
            padding: 0.5rem 1.25rem;
            transition: all 0.15s;
        }

        .btn-reroll {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-primary);
        }

            .btn-reroll:hover {
                background: #f0ece3;
            }

        .btn-reveal {
            background: #1a1a1a;
            border: 1px solid #1a1a1a;
            color: #fff;
        }

            .btn-reveal:hover {
                background: #333;
            }

        .categories {
            width: 100%;
            max-width: 560px;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .category-block {
            background: var(--surface);
            border-radius: 16px;
            border: 1px solid var(--border);
            padding: 1.25rem 1.5rem;
        }

        .category-label {
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-bottom: 0.75rem;
        }

        /* flip card */
        .flip-card {
            width: 130px;
            height: 76px;
            perspective: 700px;
            cursor: pointer;
        }

        .flip-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transition: transform 0.5s cubic-bezier(.4,0,.2,1);
        }

            .flip-inner.flipped {
                transform: rotateY(180deg);
            }

        .flip-front, .flip-back {
            position: absolute;
            inset: 0;
            border-radius: 12px;
            border: 1px solid var(--border);
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 0.5rem;
        }

        .flip-front {
            background: #f5f0e8;
            flex-direction: column;
            gap: 4px;
        }

            .flip-front .icon {
                font-size: 1.4rem;
            }

            .flip-front .hint {
                font-size: 0.65rem;
                color: var(--text-secondary);
            }

        .flip-back {
            transform: rotateY(180deg);
            font-size: 0.85rem;
            font-weight: 700;
            line-height: 1.3;
        }

        .noodle .flip-back {
            background: var(--noodle-bg);
            color: var(--noodle-text);
            border-color: var(--noodle-border);
        }

        .snack .flip-back {
            background: var(--snack-bg);
            color: var(--snack-text);
            border-color: var(--snack-border);
        }

        .anju .flip-back {
            background: var(--anju-bg);
            color: var(--anju-text);
            border-color: var(--anju-border);
        }

        .dessert .flip-back {
            background: var(--dessert-bg);
            color: var(--dessert-text);
            border-color: var(--dessert-border);
        }

        .summary {
            max-width: 560px;
            width: 100%;
            margin-top: 1.5rem;
            background: var(--surface);
            border-radius: 12px;
            border: 1px solid var(--border);
            padding: 1rem 1.5rem;
            font-size: 0.85rem;
            color: var(--text-secondary);
            display: none;
            line-height: 1.8;
        }

            .summary.visible {
                display: block;
            }

            .summary strong {
                color: var(--text-primary);
            }
    </style>
</head>
<body>

    <h1>🎴 여행 음식 뽑기</h1>
    <p class="subtitle">카드를 탭해서 오늘의 사이드 메뉴를 공개하세요</p>

    <div class="btn-row">
        <button class="btn-reroll" onclick="reroll()">🔀 다시 뽑기</button>
        <button class="btn-reveal" onclick="revealAll()">👀 전체 공개</button>
    </div>

    <div class="categories" id="categories"></div>
    <div class="summary" id="summary"></div>

    <script>
    const categories = [
      {
        key: "noodle",
        label: "라면 / 국물류",
        icon: "🍜",
        items: ["신라면", "불닭볶음면","진라면(순한)", "너구리", "어묵탕" ,"부대찌개", "조개탕", "짬뽕탕", "곱창전골"]
      },
      {
        key: "snack",
        label: "간식 / 과자",
        icon: "🍿",
        items: ["새우깡", "감자칩", "포카칩", "빈츠", "오레오", "프링글스", "홈런볼", "꼬깔콘", "젤리", "육포", "쥐포", "마른오징어"]
      },
      {
        key: "anju",
        label: "안주류",
        icon: "🍗",
          items: ["닭발", "치킨", "오돌뼈", "소시지", "쥐포구이", "마른오징어", "골뱅이무침", "콘치즈", "과일"]
      },
      {
        key: "dessert",
        label: "디저트",
        icon: "🍰",
        items: ["아이스크림", "마시멜로", "초코파이", "약과", "찰떡파이", "식혜캔", "수박바", "죠스바", "투게더", "누가바"]
      }
    ];

    let picks = {};
    let flipped = {};

    function pickRandom(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    function reroll() {
      categories.forEach(c => {
        picks[c.key] = pickRandom(c.items);
        flipped[c.key] = false;
      });
      render();
      document.getElementById('summary').classList.remove('visible');
    }

    function render() {
      const container = document.getElementById('categories');
      container.innerHTML = categories.map(c => `
        <div class="category-block">
          <div class="category-label">${c.label}</div>
          <div class="flip-card ${c.key}" onclick="flipCard('${c.key}')">
            <div class="flip-inner ${flipped[c.key] ? 'flipped' : ''}" id="inner-${c.key}">
              <div class="flip-front">
                <span class="icon">${c.icon}</span>
                <span class="hint">탭해서 공개</span>
              </div>
              <div class="flip-back">${picks[c.key]}</div>
            </div>
          </div>
        </div>
      `).join('');
    }

    function flipCard(key) {
      flipped[key] = true;
      const inner = document.getElementById('inner-' + key);
      if (inner) inner.classList.add('flipped');
      if (categories.every(c => flipped[c.key])) showSummary();
    }

    function revealAll() {
      categories.forEach(c => { flipped[c.key] = true; });
      render();
      showSummary();
    }

    function showSummary() {
      const el = document.getElementById('summary');
      el.innerHTML = '🛒 <strong>오늘의 장바구니</strong><br>' +
        categories.map(c => `<strong>${c.label}</strong>: ${picks[c.key]}`).join(' &nbsp;·&nbsp; ');
      el.classList.add('visible');
    }

    reroll();
    </script>
</body>
</html>
